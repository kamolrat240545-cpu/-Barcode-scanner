<script>

/* =========================================================
   GOOGLE APPS SCRIPT URL
========================================================= */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxGTAC048zKBQo8fex4F051HryrKYsCD_mfJ0GpKbm7xYPV-ksxeCJK6PN0GpTpw8RKvA/exec";


/* =========================================================
   VARIABLES
========================================================= */

let scanner = null;
let isScanning = false;
let scanLocked = false;


/* =========================================================
   ELEMENTS
========================================================= */

const employee =
document.getElementById("employee");

const nickname =
document.getElementById("nickname");

const barcode =
document.getElementById("barcode");

const reader =
document.getElementById("reader");

const openCamera =
document.getElementById("openCamera");

const stopCamera =
document.getElementById("stopCamera");

const saveButton =
document.getElementById("saveButton");

const status =
document.getElementById("status");

const resultBox =
document.getElementById("resultBox");

const duplicateBox =
document.getElementById("duplicateBox");

const savedBox =
document.getElementById("savedBox");


/* =========================================================
   CHANGE EMPLOYEE
========================================================= */

employee.addEventListener("change", function() {

  const parts =
  this.value.split("|");

  nickname.innerText =
  parts[1] || "";

});


/* =========================================================
   SHOW BARCODE
========================================================= */

function showBarcode(value) {

  value =
  String(value || "").trim();

  if (!value) return;

  barcode.value = value;

  resultBox.style.display = "block";

  resultBox.innerText =
    "Barcode: " + value;

}


/* =========================================================
   CLEAR MESSAGE
========================================================= */

function clearMessages() {

  duplicateBox.style.display = "none";
  duplicateBox.innerText = "";

  savedBox.style.display = "none";
  savedBox.innerText = "";

  status.innerText = "";
  status.className = "";

}


/* =========================================================
   BEEP
========================================================= */

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;

    const ctx =
      new AudioContext();

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 1000;

    gain.gain.value = 0.15;

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
      ctx.currentTime + 0.15
    );

  } catch (e) {}

}


/* =========================================================
   OPEN CAMERA
========================================================= */

openCamera.addEventListener("click", async function() {

  if (isScanning) return;

  clearMessages();

  scanLocked = false;

  try {

    if (
      typeof Html5Qrcode === "undefined"
    ) {

      throw new Error(
        "โหลดระบบ Scanner ไม่สำเร็จ"
      );

    }


    status.className = "info";

    status.innerText =
      "📷 กำลังเปิดกล้อง...";


    /* แสดงพื้นที่กล้อง */

    reader.classList.add("active");


    /* สร้าง Scanner ใหม่ */

    scanner =
      new Html5Qrcode(
        "reader",
        {
          verbose: false
        }
      );


    /*
       ตั้งค่า Scanner

       ไม่บังคับ camera ตัวใดตัวหนึ่ง
       ให้ library เลือกกล้องที่เหมาะสม
    */

    const config = {

      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        /*
          กรอบกว้างสำหรับ Barcode เส้น
        */

        const boxWidth =
          Math.floor(
            width * 0.90
          );

        const boxHeight =
          Math.floor(
            Math.min(
              Math.max(
                height * 0.25,
                120
              ),
              200
            )
          );

        return {
          width: boxWidth,
          height: boxHeight
        };

      },

      aspectRatio: 1.7777778

    };


    /*
       เริ่มกล้อง

       ใช้ facingMode แบบ string
       เพื่อให้เข้ากันได้กว้างกว่า
    */

    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      function(decodedText, decodedResult) {

        if (scanLocked) return;

        scanLocked = true;

        const value =
          String(
            decodedText || ""
          ).trim();

        if (!value) {

          scanLocked = false;

          return;

        }

        beep();

        showBarcode(value);

        status.className = "success";

        status.innerText =
          "✅ อ่าน Barcode ได้แล้ว";

        /*
           ปิดกล้องหลังอ่านสำเร็จ
        */

        stopScanner();

      },

      function(errorMessage) {

        /*
           ไม่แสดง error ทุก frame
        */

      }

    );


    isScanning = true;

    openCamera.style.display = "none";

    stopCamera.style.display = "block";

    status.className = "info";

    status.innerText =
      "📷 กำลังสแกน Barcode...";


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );

    try {

      if (scanner) {

        await scanner.clear();

      }

    } catch (e) {}

    scanner = null;

    isScanning = false;

    scanLocked = false;

    reader.classList.remove("active");

    openCamera.style.display = "block";

    stopCamera.style.display = "none";

    status.className = "error";

    status.innerText =
      "❌ เปิดกล้องไม่ได้\n" +
      "กรุณาอนุญาตการใช้กล้อง แล้วลองใหม่";

  }

});


/* =========================================================
   STOP SCANNER
========================================================= */

async function stopScanner() {

  try {

    if (
      scanner &&
      isScanning
    ) {

      await scanner.stop();

    }

  } catch (e) {

    console.log(e);

  }


  try {

    if (scanner) {

      await scanner.clear();

    }

  } catch (e) {}


  scanner = null;

  isScanning = false;

  scanLocked = false;

  reader.classList.remove("active");

  openCamera.style.display = "block";

  stopCamera.style.display = "none";

}


/* =========================================================
   STOP BUTTON
========================================================= */

stopCamera.addEventListener(
"click",
async function() {

  await stopScanner();

  status.className = "info";

  status.innerText =
    "⏹ ปิดกล้องแล้ว";

});


/* =========================================================
   CHECK DUPLICATE FROM GOOGLE SHEET
========================================================= */

async function checkDuplicateFromServer(code) {

  try {

    const url =
      WEB_APP_URL +
      "?action=check&barcode=" +
      encodeURIComponent(code) +
      "&_=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    const data =
      await response.json();

    return data;

  } catch (error) {

    console.error(
      "Duplicate check error:",
      error
    );

    return {

      success: false,

      duplicate: false,

      error: true,

      message:
        "ตรวจสอบ Barcode ไม่สำเร็จ"

    };

  }

}


/* =========================================================
   SAVE
========================================================= */

saveButton.addEventListener(
"click",
async function() {

  clearMessages();


  const code =
    barcode.value.trim();


  if (!code) {

    status.className = "error";

    status.innerText =
      "❌ กรุณาสแกนหรือกรอก Barcode ก่อน";

    barcode.focus();

    return;

  }


  const parts =
    employee.value.split("|");


  const fullName =
    parts[0] || "";

  const employeeNickname =
    parts[1] || "";


  if (!fullName) {

    status.className = "error";

    status.innerText =
      "❌ กรุณาเลือกผู้สแกน";

    return;

  }


  saveButton.disabled = true;

  saveButton.innerText =
    "⏳ กำลังตรวจสอบ...";


  status.className = "info";

  status.innerText =
    "🔎 กำลังตรวจสอบ Barcode...";


  try {

    /*
       ตรวจซ้ำจาก Google Sheet จริง
    */

    const duplicateCheck =
      await checkDuplicateFromServer(
        code
      );


    /*
       ถ้าตรวจสอบไม่ได้
       หยุดก่อน ไม่เสี่ยงบันทึกซ้ำ
    */

    if (
      duplicateCheck.error
    ) {

      throw new Error(
        duplicateCheck.message ||
        "ตรวจสอบ Barcode ไม่สำเร็จ"
      );

    }


    /*
       ถ้าซ้ำ
    */

    if (
      duplicateCheck.duplicate
    ) {

      duplicateBox.style.display =
        "block";

      duplicateBox.innerText =
        "⚠️ Barcode นี้มีอยู่ในระบบแล้ว\n\n" +
        code;


      status.className = "error";

      status.innerText =
        "❌ ไม่บันทึก เพราะ Barcode ซ้ำ";

      return;

    }


    /*
       ส่งข้อมูลด้วย GET

       วิธีนี้หลีกเลี่ยง CORS
       ได้ดีกว่า POST no-cors
    */

    saveButton.innerText =
      "⏳ กำลังบันทึก...";

    status.className = "info";

    status.innerText =
      "💾 กำลังบันทึกลง Google Sheet...";


    const saveUrl =
      WEB_APP_URL +
      "?action=save" +
      "&fullName=" +
      encodeURIComponent(fullName) +
      "&nickname=" +
      encodeURIComponent(employeeNickname) +
      "&barcode=" +
      encodeURIComponent(code) +
      "&_=" +
      Date.now();


    const response =
      await fetch(
        saveUrl,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    const result =
      await response.json();


    /*
       ตรวจผลจาก Apps Script
    */

    if (
      result.duplicate
    ) {

      duplicateBox.style.display =
        "block";

      duplicateBox.innerText =
        "⚠️ Barcode นี้มีอยู่ในระบบแล้ว\n\n" +
        code;

      status.className = "error";

      status.innerText =
        "❌ ไม่บันทึก เพราะ Barcode ซ้ำ";

      return;

    }


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Google Sheet ไม่ตอบรับ"
      );

    }


    /*
       สำเร็จ
    */

    savedBox.style.display =
      "block";

    savedBox.innerText =
      "✅ บันทึกเรียบร้อย\n\n" +
      code;


    status.className =
      "success";

    status.innerText =
      "✅ บันทึกข้อมูลลง Google Sheet แล้ว";


    barcode.value = "";

    resultBox.style.display =
      "none";


  } catch (error) {

    console.error(
      "Save error:",
      error
    );

    status.className =
      "error";

    status.innerText =
      "❌ บันทึกไม่สำเร็จ\n" +
      (
        error.message ||
        "เกิดข้อผิดพลาด"
      );

  } finally {

    saveButton.disabled = false;

    saveButton.innerText =
      "💾 บันทึกลง Google Sheet";

  }

});


/* =========================================================
   ENTER
========================================================= */

barcode.addEventListener(
"keydown",
function(event) {

  if (
    event.key === "Enter"
  ) {

    event.preventDefault();

    showBarcode(
      barcode.value
    );

  }

});


/* =========================================================
   INPUT
========================================================= */

barcode.addEventListener(
"input",
function() {

  const value =
    this.value.trim();

  if (value) {

    resultBox.style.display =
      "block";

    resultBox.innerText =
      "Barcode: " + value;

  } else {

    resultBox.style.display =
      "none";

  }

});


/* =========================================================
   INITIAL
========================================================= */

reader.classList.remove("active");

stopCamera.style.display = "none";

openCamera.style.display = "block";

status.innerText = "";

</script>

</body>
