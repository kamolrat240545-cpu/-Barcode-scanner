<script>


/* =========================================================
   GOOGLE APPS SCRIPT WEB APP URL
   ========================================================= */

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxY0QEs75b7fhDUPhr3-wzR_smF7RU5FyatW1rySt2HO23DbPNaf_g_A3kiHXj_GTlJDw/exec";



/* =========================================================
   ตัวแปร
   ========================================================= */

let scanner = null;

let isScanning = false;

let scanLocked = false;

let saveLocked = false;



/* =========================================================
   Element
   ========================================================= */

const employee =
  document.getElementById(
    "employee"
  );


const nickname =
  document.getElementById(
    "nickname"
  );


const barcodeInput =
  document.getElementById(
    "barcode"
  );


const resultBox =
  document.getElementById(
    "resultBox"
  );


const status =
  document.getElementById(
    "status"
  );


const openCamera =
  document.getElementById(
    "openCamera"
  );


const stopCamera =
  document.getElementById(
    "stopCamera"
  );


const saveButton =
  document.getElementById(
    "saveButton"
  );



/* =========================================================
   เปลี่ยนชื่อเล่น
   ========================================================= */

employee.addEventListener(
  "change",
  function () {

    const parts =
      this.value.split("|");


    nickname.textContent =
      parts[1] || "";

  }
);



/* =========================================================
   แสดงสถานะ
   ========================================================= */

function showStatus(
  message,
  type
) {

  status.textContent =
    message || "";

  status.className =
    type || "";

}



/* =========================================================
   แสดง Barcode
   ========================================================= */

function showBarcode(
  value
) {

  resultBox.style.display =
    "block";


  resultBox.classList.remove(
    "duplicate"
  );


  resultBox.textContent =
    "Barcode: " + value;

}



/* =========================================================
   แสดง Barcode ซ้ำ
   ========================================================= */

function showDuplicate(
  value
) {

  resultBox.style.display =
    "block";


  resultBox.classList.add(
    "duplicate"
  );


  resultBox.textContent =
    "⚠️ บาร์โค้ดซ้ำ: " +
    value;

}



/* =========================================================
   เสียงแจ้งเตือน
   ========================================================= */

function beep(
  frequency,
  duration
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {
      return;
    }


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      ctx.destination
    );


    oscillator.frequency.value =
      frequency;


    gain.gain.value =
      0.08;


    oscillator.start();


    setTimeout(
      function () {

        try {

          oscillator.stop();

          ctx.close();

        } catch (e) {}

      },
      duration
    );

  } catch (e) {

    console.log(
      "Browser ไม่อนุญาตเสียง"
    );

  }

}



/* =========================================================
   เสียงสแกนสำเร็จ
   ========================================================= */

function scanBeep() {

  beep(
    1000,
    120
  );

}



/* =========================================================
   เสียง Barcode ซ้ำ
   ========================================================= */

function duplicateBeep() {

  beep(
    350,
    180
  );


  setTimeout(
    function () {

      beep(
        350,
        180
      );

    },
    220
  );

}



/* =========================================================
   ตั้งค่าประเภท Barcode ที่ต้องการอ่าน
   ========================================================= */

function getBarcodeFormats() {

  return [

    Html5QrcodeSupportedFormats.CODE_128,

    Html5QrcodeSupportedFormats.CODE_39,

    Html5QrcodeSupportedFormats.CODE_93,

    Html5QrcodeSupportedFormats.CODABAR,

    Html5QrcodeSupportedFormats.ITF,

    Html5QrcodeSupportedFormats.EAN_13,

    Html5QrcodeSupportedFormats.EAN_8,

    Html5QrcodeSupportedFormats.UPC_A,

    Html5QrcodeSupportedFormats.UPC_E,

    Html5QrcodeSupportedFormats.QR_CODE

  ];

}



/* =========================================================
   เปิดกล้อง
   ========================================================= */

async function startCamera() {

  if (isScanning) {
    return;
  }


  try {

    showStatus(
      "📷 กำลังเปิดกล้อง...",
      "info"
    );


    scanLocked =
      false;


    scanner =
      new Html5Qrcode(
        "reader"
      );


    /*
      สำคัญ:
      รองรับ Barcode เส้นยาว CODE_128
      และ Barcode ทั่วไป
    */

    const config = {

      fps: 15,

      qrbox: function (
        viewfinderWidth,
        viewfinderHeight
      ) {

        /*
          กรอบสแกนกว้าง
          เหมาะกับ Barcode แนวยาว
        */

        let width =
          Math.floor(
            viewfinderWidth * 0.90
          );


        let height =
          Math.floor(
            viewfinderHeight * 0.35
          );


        if (height < 100) {
          height = 100;
        }


        return {
          width: width,
          height: height
        };

      },

      aspectRatio: 1.7777778,

      formatsToSupport:
        getBarcodeFormats(),

      experimentalFeatures: {

        useBarCodeDetectorIfSupported:
          true

      }

    };


    await scanner.start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      config,

      function (
        decodedText,
        decodedResult
      ) {

        if (
          scanLocked
        ) {
          return;
        }


        if (
          !decodedText
        ) {
          return;
        }


        handleScan(
          decodedText
        );

      },

      function (
        errorMessage
      ) {

        /*
          error จากการค้นหา Barcode
          ไม่ต้องแสดงให้ผู้ใช้เห็น
        */

      }

    );


    isScanning =
      true;


    openCamera.style.display =
      "none";


    stopCamera.style.display =
      "block";


    showStatus(
      "📷 กำลังสแกน Barcode...",
      "info"
    );

  } catch (error) {

    console.error(
      error
    );


    /*
      ถ้า exact environment ใช้ไม่ได้
      ลอง environment แบบธรรมดา
    */

    try {

      if (scanner) {

        try {

          await scanner.clear();

        } catch (e) {}

      }


      scanner =
        new Html5Qrcode(
          "reader"
        );


      const config = {

        fps: 15,

        qrbox: function (
          width,
          height
        ) {

          return {

            width:
              Math.floor(
                width * 0.90
              ),

            height:
              Math.max(
                100,
                Math.floor(
                  height * 0.35
                )
              )

          };

        },

        formatsToSupport:
          getBarcodeFormats(),

        experimentalFeatures: {

          useBarCodeDetectorIfSupported:
            true

        }

      };


      await scanner.start(

        {
          facingMode:
            "environment"
        },

        config,

        function (
          decodedText
        ) {

          if (
            scanLocked
          ) {
            return;
          }


          if (
            decodedText
          ) {

            handleScan(
              decodedText
            );

          }

        },

        function () {}

      );


      isScanning =
        true;


      openCamera.style.display =
        "none";


      stopCamera.style.display =
        "block";


      showStatus(
        "📷 กำลังสแกน Barcode...",
        "info"
      );

    } catch (error2) {

      console.error(
        error2
      );


      isScanning =
        false;


      scanner =
        null;


      showStatus(
        "❌ เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง",
        "error"
      );

    }

  }

}



/* =========================================================
   ปิดกล้อง
   ========================================================= */

async function stopCameraFunction() {

  if (
    scanner &&
    isScanning
  ) {

    try {

      await scanner.stop();

    } catch (e) {

      console.log(
        "stop scanner error",
        e
      );

    }


    try {

      await scanner.clear();

    } catch (e) {

      console.log(
        "clear scanner error",
        e
      );

    }

  }


  scanner =
    null;


  isScanning =
    false;


  scanLocked =
    false;


  openCamera.style.display =
    "block";


  stopCamera.style.display =
    "none";

}



/* =========================================================
   เมื่อสแกน Barcode ได้
   ========================================================= */

function handleScan(
  value
) {

  if (
    scanLocked
  ) {
    return;
  }


  value =
    String(
      value || ""
    ).trim();


  if (!value) {
    return;
  }


  scanLocked =
    true;


  barcodeInput.value =
    value;


  showBarcode(
    value
  );


  showStatus(
    "✅ อ่าน Barcode ได้แล้ว",
    "success"
  );


  scanBeep();


  /*
    หยุดกล้องทันที
    ป้องกันการอ่านเลขเดิมซ้ำหลายครั้ง
  */

  stopCameraFunction();


  /*
    เลื่อนไปที่ช่อง Barcode
  */

  setTimeout(
    function () {

      barcodeInput.focus();

    },
    100
  );

}



/* =========================================================
   ส่งข้อมูล Google Apps Script แบบ JSONP
   ========================================================= */

function saveToGoogleSheet(
  fullName,
  nicknameValue,
  barcode
) {

  return new Promise(
    function (
      resolve,
      reject
    ) {

      const callbackName =
        "barcodeCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished =
        false;


      function cleanup() {

        try {

          delete window[
            callbackName
          ];

        } catch (e) {

          window[
            callbackName
          ] =
            undefined;

        }


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }


      window[
        callbackName
      ] =
        function (
          result
        ) {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          resolve(
            result
          );

        };


      script.onerror =
        function () {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "ไม่สามารถเชื่อมต่อ Google Apps Script ได้"
            )
          );

        };


      const params =
        new URLSearchParams();


      params.set(
        "action",
        "save"
      );


      params.set(
        "fullName",
        fullName
      );


      params.set(
        "nickname",
        nicknameValue
      );


      params.set(
        "barcode",
        barcode
      );


      params.set(
        "callback",
        callbackName
      );


      script.src =
        WEB_APP_URL +
        "?" +
        params.toString();


      document.body.appendChild(
        script
      );


      /*
        Timeout 30 วินาที
      */

      setTimeout(
        function () {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              "การเชื่อมต่อใช้เวลานานเกินไป"
            )
          );

        },
        30000
      );

    }
  );

}



/* =========================================================
   บันทึก Barcode
   ========================================================= */

async function saveBarcode() {

  if (saveLocked) {
    return;
  }


  const employeeValue =
    employee.value.split("|");


  const fullName =
    String(
      employeeValue[0] || ""
    ).trim();


  const nicknameValue =
    String(
      employeeValue[1] || ""
    ).trim();


  const barcode =
    String(
      barcodeInput.value || ""
    ).trim();


  /*
    ตรวจว่ามี Barcode หรือไม่
  */

  if (!barcode) {

    showStatus(
      "❌ กรุณาสแกนหรือกรอก Barcode ก่อน",
      "error"
    );


    barcodeInput.focus();


    return;

  }


  saveLocked =
    true;


  saveButton.disabled =
    true;


  saveButton.textContent =
    "⏳ กำลังตรวจสอบ...";


  showStatus(
    "🔍 กำลังตรวจสอบเลขพัสดุ...",
    "info"
  );


  try {

    const result =
      await saveToGoogleSheet(

        fullName,

        nicknameValue,

        barcode

      );


    /*
      =================================================
      Barcode ซ้ำ
      =================================================
    */

    if (
      result &&
      (
        result.duplicate === true ||
        result.duplicate === "true"
      )
    ) {

      duplicateBeep();


      showDuplicate(
        barcode
      );


      showStatus(
        "⚠️ บาร์โค้ดนี้มีอยู่ในระบบแล้ว ไม่ได้บันทึกซ้ำ",
        "error"
      );


      alert(
        "⚠️ บาร์โค้ดซ้ำ\n\n" +
        barcode +
        "\n\nเลขพัสดุนี้มีอยู่ใน Google Sheet แล้ว\nระบบจึงไม่บันทึกซ้ำ"
      );


      /*
        เลือกข้อความไว้
        เพื่อให้สแกนเลขใหม่ทับได้เลย
      */

      barcodeInput.select();


      return;

    }


    /*
      =================================================
      บันทึกสำเร็จ
      =================================================
    */

    if (
      result &&
      (
        result.success === true ||
        result.success === "true"
      )
    ) {

      resultBox.style.display =
        "block";


      resultBox.classList.remove(
        "duplicate"
      );


      resultBox.textContent =
        "✅ บันทึกแล้ว: " +
        barcode;


      showStatus(
        "✅ บันทึกข้อมูลสำเร็จ",
        "success"
      );


      /*
        เคลียร์ช่อง
      */

      barcodeInput.value =
        "";


      scanLocked =
        false;


      /*
        เตรียมสแกนรายการถัดไป
      */

      barcodeInput.focus();


      return;

    }


    /*
      =================================================
      Backend ส่ง Error
      =================================================
    */

    throw new Error(

      result &&
      result.message

        ? result.message

        : "ไม่สามารถบันทึกข้อมูลได้"

    );

  } catch (error) {

    console.error(
      error
    );


    showStatus(
      "❌ " +
      (
        error.message ||
        "เกิดข้อผิดพลาด"
      ),
      "error"
    );


    alert(
      "❌ เกิดข้อผิดพลาด\n\n" +
      (
        error.message ||
        "ไม่สามารถบันทึกข้อมูลได้"
      )
    );

  } finally {

    saveLocked =
      false;


    saveButton.disabled =
      false;


    saveButton.textContent =
      "💾 บันทึกลง Google Sheet";

  }

}

   ========================================================= */

saveButton.addEventListener(

  }
);

   ========================================================= */

barcodeInput.addEventListener(
  "keydown",
  function (event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();


      saveBarcode();

    }

  }
);



/* =========================================================
   ป้องกันการปิดหน้าแล้วกล้องค้าง
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function () {

    try {

      if (
        scanner &&
        isScanning
      ) {

        scanner.stop();

      }

    } catch (e) {}

  }
);



/* =========================================================
   เริ่มต้นระบบ
   ========================================================= */

showStatus(
  "พร้อมสแกน Barcode",
  "info"
);


</script>
