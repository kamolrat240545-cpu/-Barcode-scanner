<script>


/* =========================================================
   GOOGLE APPS SCRIPT
   ========================================================= */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxY0QEs75b7fhDUPhr3-wzR_smF7RU5FyatW1rySt2HO23DbPNaf_g_A3kiHXj_GTlJDw/exec";


/* =========================================================
   ตัวแปร
   ========================================================= */

let scanner = null;

let isScanning = false;

let scanLocked = false;


/* =========================================================
   ELEMENT
   ========================================================= */

const employee =
document.getElementById("employee");

const nickname =
document.getElementById("nickname");

const barcode =
document.getElementById("barcode");

const reader =
document.getElementById("reader");

const openCamera =
document.getElementById("openCamera");

const stopCamera =
document.getElementById("stopCamera");

const saveButton =
document.getElementById("saveButton");

const status =
document.getElementById("status");

const resultBox =
document.getElementById("resultBox");

const duplicateBox =
document.getElementById("duplicateBox");

const savedBox =
document.getElementById("savedBox");


/* =========================================================
   เปลี่ยนชื่อเล่น
   ========================================================= */

employee.addEventListener(
"change",
function () {

  const parts =
  this.value.split("|");

  nickname.innerText =
  parts[1] || "";

});


/* =========================================================
   แสดง Barcode
   ========================================================= */

function showBarcode(value) {

  value =
  String(value || "").trim();

  if (!value) return;

  barcode.value = value;

  resultBox.style.display =
    "block";

  resultBox.innerText =
    "Barcode: " + value;

}


/* =========================================================
   ล้างข้อความ
   ========================================================= */

function clearMessages() {

  duplicateBox.style.display =
    "none";

  duplicateBox.innerText =
    "";

  savedBox.style.display =
    "none";

  status.innerText =
    "";

  status.className =
    "";

}


/* =========================================================
   BEEP
   ========================================================= */

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;

    const ctx =
      new AudioContext();

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.type =
      "sine";

    oscillator.frequency.value =
      1000;

    gain.gain.value =
      0.15;

    oscillator.connect(gain);

    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
      ctx.currentTime + 0.15
    );

  } catch (e) {}

}


/* =========================================================
   เปิดกล้อง
   ========================================================= */

openCamera.addEventListener(
"click",
async function () {

  if (isScanning) return;

  clearMessages();

  try {

    status.className =
      "info";

    status.innerText =
      "📷 กำลังเปิดกล้อง...";


    /*
      สำคัญ:
      ตรงนี้ค่อยแสดง reader
    */

    reader.classList.add("active");


    scanner =
      new Html5Qrcode("reader");


    /*
      รองรับ Barcode หลายชนิด
      รวมถึง CODE_128 ที่ใช้กับ Flash
    */

    const formatsToSupport = [

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.CODE_93,

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E,

      Html5QrcodeSupportedFormats.ITF,

      Html5QrcodeSupportedFormats.CODABAR,

      Html5QrcodeSupportedFormats.QR_CODE

    ];


    const config = {

      fps: 15,

      qrbox: function (
        viewfinderWidth,
        viewfinderHeight
      ) {

        /*
          กรอบแนวนอน
          สำหรับ Barcode เส้นยาว
        */

        const width =
          Math.floor(
            viewfinderWidth * 0.90
          );

        const height =
          Math.floor(
            Math.min(
              viewfinderHeight * 0.35,
              180
            )
          );

        return {
          width: width,
          height: height
        };

      },

      aspectRatio: 1.777778,

      formatsToSupport:
        formatsToSupport,

      experimentalFeatures: {

        useBarCodeDetectorIfSupported:
          true

      },

      rememberLastUsedCamera:
        true

    };


    await scanner.start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      config,

      function(decodedText) {

        if (scanLocked)
          return;

        scanLocked = true;

        beep();

        showBarcode(decodedText);

        status.className =
          "success";

        status.innerText =
          "✅ อ่าน Barcode ได้แล้ว";

        /*
          หยุดกล้องหลังอ่านสำเร็จ
        */

        stopScanner();

      },

      function(errorMessage) {

        /*
          ไม่ต้องแสดง error
          ทุก frame เพราะจะรกหน้าจอ
        */

      }

    );


    isScanning = true;

    openCamera.style.display =
      "none";

    stopCamera.style.display =
      "block";

    status.className =
      "info";

    status.innerText =
      "📷 กำลังสแกน Barcode...";


  } catch (error) {

    console.error(error);

    reader.classList.remove(
      "active"
    );

    isScanning = false;

    openCamera.style.display =
      "block";

    stopCamera.style.display =
      "none";

    status.className =
      "error";

    status.innerText =
      "❌ เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง";


  }

});


/* =========================================================
   ปิด Scanner
   ========================================================= */

async function stopScanner() {

  try {

    if (
      scanner &&
      isScanning
    ) {

      await scanner.stop();

    }

  } catch (e) {

    console.log(e);

  }


  try {

    if (scanner) {

      await scanner.clear();

    }

  } catch (e) {}


  scanner = null;

  isScanning = false;

  scanLocked = false;

  reader.classList.remove(
    "active"
  );

  openCamera.style.display =
    "block";

  stopCamera.style.display =
    "none";

}


stopCamera.addEventListener(
"click",
async function () {

  await stopScanner();

  status.innerText =
    "⏹ ปิดกล้องแล้ว";

  status.className =
    "info";

});


/* =========================================================
   ตรวจ Barcode ซ้ำในเครื่อง
   ========================================================= */

function checkLocalDuplicate(code) {

  const key =
    "barcode_history";

  let history = [];

  try {

    history =
      JSON.parse(
        localStorage.getItem(key)
      ) || [];

  } catch (e) {

    history = [];

  }


  return history.includes(code);

}


/* =========================================================
   เพิ่ม Barcode ลงประวัติเครื่อง
   ========================================================= */

function addLocalBarcode(code) {

  const key =
    "barcode_history";

  let history = [];

  try {

    history =
      JSON.parse(
        localStorage.getItem(key)
      ) || [];

  } catch (e) {

    history = [];

  }


  if (!history.includes(code)) {

    history.push(code);

  }


  /*
    เก็บสูงสุด 2000 รายการ
  */

  if (history.length > 2000) {

    history =
      history.slice(
        history.length - 2000
      );

  }


  localStorage.setItem(
    key,
    JSON.stringify(history)
  );

}


/* =========================================================
   บันทึก
   ========================================================= */

saveButton.addEventListener(
"click",
async function () {

  clearMessages();


  const code =
    barcode.value.trim();


  if (!code) {

    status.className =
      "error";

    status.innerText =
      "❌ กรุณาสแกนหรือกรอก Barcode ก่อน";

    barcode.focus();

    return;

  }


  /*
    เช็กซ้ำจากเครื่องก่อน
  */

  if (
    checkLocalDuplicate(code)
  ) {

    duplicateBox.style.display =
      "block";

    duplicateBox.innerText =
      "⚠️ Barcode นี้เคยสแกนไปแล้ว\n\n" +
      code;

    status.className =
      "error";

    status.innerText =
      "❌ ไม่บันทึก เพราะ Barcode ซ้ำ";

    return;

  }


  const parts =
    employee.value.split("|");


  const employeeName =
    parts[0] || "";

  const employeeNickname =
    parts[1] || "";


  saveButton.disabled =
    true;

  saveButton.innerText =
    "⏳ กำลังบันทึก...";


  status.className =
    "info";

  status.innerText =
    "🔄 กำลังส่งข้อมูลไป Google Sheet...";


  /*
    ใช้ POST แบบ no-cors
    เพื่อหลีกเลี่ยงปัญหา CORS
    จาก GitHub Pages → Apps Script
  */

  try {

    const formData =
      new URLSearchParams();


    formData.append(
      "barcode",
      code
    );


    formData.append(
      "employee",
      employeeName
    );


    formData.append(
      "nickname",
      employeeNickname
    );


    formData.append(
      "timestamp",
      new Date().toISOString()
    );


    await fetch(
      WEB_APP_URL,
      {

        method: "POST",

        mode: "no-cors",

        headers: {

          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"

        },

        body:
          formData.toString()

      }
    );


    /*
      ถ้า request ถูกส่งออกไปแล้ว
      เก็บไว้ในประวัติเครื่อง
    */

    addLocalBarcode(code);


    savedBox.style.display =
      "block";

    savedBox.innerText =
      "✅ ส่งข้อมูลบันทึกแล้ว\n" +
      code;


    status.className =
      "success";

    status.innerText =
      "✅ บันทึกข้อมูลเรียบร้อย";


    /*
      เคลียร์ช่อง Barcode
      หลังบันทึกสำเร็จ
    */

    barcode.value = "";

    resultBox.style.display =
      "none";


  } catch (error) {

    console.error(error);

    status.className =
      "error";

    status.innerText =
      "❌ ส่งข้อมูลไป Google Sheet ไม่สำเร็จ";

  }


  saveButton.disabled =
    false;

  saveButton.innerText =
    "💾 บันทึกลง Google Sheet";

});


/* =========================================================
   กด Enter ในช่อง Barcode
   ========================================================= */

barcode.addEventListener(
"keydown",
function(event) {

  if (
    event.key === "Enter"
  ) {

    event.preventDefault();

    showBarcode(
      barcode.value
    );

  }

});


/* =========================================================
   แสดง Barcode ตอนพิมพ์เอง
   ========================================================= */

barcode.addEventListener(
"input",
function() {

  const value =
    this.value.trim();


  if (value) {

    resultBox.style.display =
      "block";

    resultBox.innerText =
      "Barcode: " + value;

  } else {

    resultBox.style.display =
      "none";

  }

});


/* =========================================================
   ตอนเปิดหน้าเว็บ
   กล้องต้องยังไม่แสดง
   ========================================================= */

reader.classList.remove(
  "active"
);

stopCamera.style.display =
  "none";

openCamera.style.display =
  "block";

status.innerText = "";

</script>

</body>
</html>
