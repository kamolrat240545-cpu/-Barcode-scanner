<script>


/* =========================================================
   GOOGLE APPS SCRIPT WEB APP
   ========================================================= */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxGTAC048zKBQo8fex4F051HryrKYsCD_mfJ0GpKbm7xYPV-ksxeCJK6PN0GpTpw8RKvA/exec";


/* =========================================================
   ตัวแปร
   ========================================================= */

let scanner = null;

let isScanning = false;

let scanLocked = false;


/* =========================================================
   ELEMENT
   ========================================================= */

const employee =
document.getElementById("employee");

const nickname =
document.getElementById("nickname");

const barcode =
document.getElementById("barcode");

const reader =
document.getElementById("reader");

const openCamera =
document.getElementById("openCamera");

const stopCamera =
document.getElementById("stopCamera");

const saveButton =
document.getElementById("saveButton");

const status =
document.getElementById("status");

const resultBox =
document.getElementById("resultBox");

const duplicateBox =
document.getElementById("duplicateBox");

const savedBox =
document.getElementById("savedBox");


/* =========================================================
   เปลี่ยนชื่อเล่น
   ========================================================= */

employee.addEventListener(
"change",
function () {

  const parts =
  this.value.split("|");

  nickname.innerText =
  parts[1] || "";

});


/* =========================================================
   แสดง Barcode
   ========================================================= */

function showBarcode(value) {

  value =
  String(value || "").trim();

  if (!value) return;

  barcode.value =
    value;

  resultBox.style.display =
    "block";

  resultBox.innerText =
    "Barcode: " + value;

}


/* =========================================================
   ล้างข้อความ
   ========================================================= */

function clearMessages() {

  duplicateBox.style.display =
    "none";

  duplicateBox.innerText =
    "";

  savedBox.style.display =
    "none";

  savedBox.innerText =
    "";

  status.innerText =
    "";

  status.className =
    "";

}


/* =========================================================
   BEEP
   ========================================================= */

function beep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) {
      return;
    }

    const ctx =
      new AudioContext();

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.type =
      "sine";

    oscillator.frequency.value =
      1000;

    gain.gain.value =
      0.15;

    oscillator.connect(gain);

    gain.connect(ctx.destination);

    oscillator.start();

    oscillator.stop(
      ctx.currentTime + 0.15
    );

  } catch (e) {

    console.log(e);

  }

}


/* =========================================================
   หยุด Scanner
   ========================================================= */

async function stopScanner() {

  const currentScanner =
    scanner;

  scanner = null;

  isScanning = false;

  scanLocked = true;


  try {

    if (currentScanner) {

      await currentScanner.stop();

    }

  } catch (e) {

    console.log(
      "scanner stop:",
      e
    );

  }


  try {

    if (currentScanner) {

      await currentScanner.clear();

    }

  } catch (e) {

    console.log(
      "scanner clear:",
      e
    );

  }


  reader.classList.remove(
    "active"
  );

  openCamera.style.display =
    "block";

  stopCamera.style.display =
    "none";

}


/* =========================================================
   เปิดกล้อง
   ========================================================= */

openCamera.addEventListener(
"click",
async function () {

  if (isScanning) {
    return;
  }


  clearMessages();


  barcode.value = "";

  resultBox.style.display =
    "none";


  scanLocked = false;


  status.className =
    "info";

  status.innerText =
    "📷 กำลังเปิดกล้อง...";


  reader.innerHTML = "";

  reader.classList.add(
    "active"
  );


  try {

    scanner =
      new Html5Qrcode(
        "reader",
        {
          verbose: false
        }
      );


    /*
      รองรับ Barcode
      หลายชนิด
    */

    const formatsToSupport = [

      Html5QrcodeSupportedFormats.QR_CODE,

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.CODE_93,

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E,

      Html5QrcodeSupportedFormats.ITF,

      Html5QrcodeSupportedFormats.CODABAR

    ];


    /*
      กรอบสแกน
      ทำให้กว้างเพื่อ Barcode เส้นยาว
    */

    const config = {

      fps: 20,

      aspectRatio: 1.777778,

      qrbox:
        function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const width =
            Math.floor(
              viewfinderWidth * 0.94
            );

          let height =
            Math.floor(
              viewfinderHeight * 0.32
            );


          if (height < 100) {
            height = 100;
          }


          if (height > 200) {
            height = 200;
          }


          return {
            width:
              width,

            height:
              height
          };

        },

      formatsToSupport:
        formatsToSupport,

      experimentalFeatures: {

        useBarCodeDetectorIfSupported:
          true

      }

    };


    /*
      ขอใช้กล้องหลัง
    */

    await scanner.start(

      {
        facingMode:
        {
          ideal:
            "environment"
        }
      },

      config,

      async function(decodedText) {

        if (scanLocked) {
          return;
        }


        scanLocked = true;


        const value =
          String(
            decodedText || ""
          ).trim();


        if (!value) {

          scanLocked = false;

          return;

        }


        beep();


        showBarcode(
          value
        );


        status.className =
          "success";

        status.innerText =
          "✅ อ่าน Barcode ได้แล้ว";


        /*
          ปิดกล้องหลังอ่านได้
        */

        await stopScanner();


        /*
          หลังปิด scanner
          คงข้อความสำเร็จไว้
        */

        status.className =
          "success";

        status.innerText =
          "✅ อ่าน Barcode ได้แล้ว กรุณากดบันทึก";

      },

      function(errorMessage) {

        /*
          ไม่แสดง error ทุก frame
        */

      }

    );


    isScanning = true;


    openCamera.style.display =
      "none";

    stopCamera.style.display =
      "block";


    status.className =
      "info";

    status.innerText =
      "📷 กำลังสแกน Barcode...";


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    try {

      if (scanner) {

        await scanner.clear();

      }

    } catch (e) {}


    scanner = null;

    isScanning = false;

    scanLocked = false;


    reader.classList.remove(
      "active"
    );


    openCamera.style.display =
      "block";

    stopCamera.style.display =
      "none";


    let message =
      "❌ เปิดกล้องไม่ได้";


    if (
      error &&
      error.message
    ) {

      console.log(
        error.message
      );

    }


    status.className =
      "error";

    status.innerText =
      message +
      " กรุณาอนุญาตการใช้กล้อง";

  }

});


/* =========================================================
   ปุ่มปิดกล้อง
   ========================================================= */

stopCamera.addEventListener(
"click",
async function () {

  await stopScanner();


  scanLocked = false;


  status.className =
    "info";

  status.innerText =
    "⏹ ปิดกล้องแล้ว";

});


/* =========================================================
   Local Storage
   ========================================================= */

function getLocalHistory() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "barcode_history"
      )
    ) || [];

  } catch (e) {

    return [];

  }

}


/* =========================================================
   ตรวจ Barcode ซ้ำในเครื่อง
   ========================================================= */

function checkLocalDuplicate(
  code
) {

  const history =
    getLocalHistory();

  return history.includes(
    code
  );

}


/* =========================================================
   เพิ่ม Barcode ในเครื่อง
   ========================================================= */

function addLocalBarcode(
  code
) {

  let history =
    getLocalHistory();


  if (!history.includes(code)) {

    history.push(code);

  }


  if (
    history.length > 2000
  ) {

    history =
      history.slice(
        history.length - 2000
      );

  }


  try {

    localStorage.setItem(
      "barcode_history",
      JSON.stringify(history)
    );

  } catch (e) {

    console.log(
      "localStorage error:",
      e
    );

  }

}


/* =========================================================
   ตรวจซ้ำกับ Google Sheet
   ใช้ GET JSONP
   ========================================================= */

function checkServerDuplicate(
  code
) {

  return new Promise(
    function(resolve) {

      const callbackName =
        "barcodeCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finished = false;


      const cleanup =
        function() {

          try {

            delete window[
              callbackName
            ];

          } catch (e) {}

          if (script.parentNode) {

            script.parentNode.removeChild(
              script
            );

          }

        };


      const finish =
        function(result) {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          resolve(
            result
          );

        };


      window[callbackName] =
        function(data) {

          finish(
            data
          );

        };


      script.onerror =
        function() {

          finish({

            success: false,

            duplicate: false,

            error:
              true

          });

        };


      const url =
        WEB_APP_URL +
        "?action=history" +
        "&limit=50" +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&_=" +
        Date.now();


      script.src =
        url;


      document
        .body
        .appendChild(
          script
        );


      /*
        ถ้าเซิร์ฟเวอร์ไม่ตอบ
        ภายใน 8 วินาที
      */

      setTimeout(
        function() {

          finish({

            success: false,

            duplicate: false,

            timeout: true

          });

        },
        8000
      );

    }
  );

}


/* =========================================================
   บันทึกข้อมูล
   ========================================================= */

saveButton.addEventListener(
"click",
async function() {

  clearMessages();


  const code =
    String(
      barcode.value || ""
    ).trim();


  /*
    ตรวจ Barcode
  */

  if (!code) {

    status.className =
      "error";

    status.innerText =
      "❌ กรุณาสแกนหรือกรอก Barcode ก่อน";

    barcode.focus();

    return;

  }


  /*
    ตรวจชื่อ
  */

  const parts =
    employee.value.split("|");


  const employeeName =
    String(
      parts[0] || ""
    ).trim();


  const employeeNickname =
    String(
      parts[1] || ""
    ).trim();


  if (!employeeName) {

    status.className =
      "error";

    status.innerText =
      "❌ กรุณาเลือกผู้สแกน";

    return;

  }


  /*
    ตรวจซ้ำในเครื่อง
  */

  if (
    checkLocalDuplicate(code)
  ) {

    duplicateBox.style.display =
      "block";

    duplicateBox.innerText =
      "⚠️ Barcode นี้เคยสแกนไปแล้ว\n\n" +
      code;


    status.className =
      "error";

    status.innerText =
      "❌ ไม่บันทึก เพราะ Barcode ซ้ำ";

    return;

  }


  saveButton.disabled =
    true;

  saveButton.innerText =
    "⏳ กำลังตรวจสอบ...";


  status.className =
    "info";

  status.innerText =
    "🔍 กำลังตรวจสอบ Barcode...";


  /*
    ตรวจซ้ำกับ Google Sheet ก่อน
  */

  try {

    const serverResult =
      await checkServerDuplicate(
        code
      );


    /*
      ถ้าดึงข้อมูลจาก Server สำเร็จ
    */

    if (
      serverResult &&
      serverResult.success &&
      Array.isArray(
        serverResult.items
      )
    ) {

      const duplicate =
        serverResult.items.some(
          function(item) {

            return String(
              item.barcode || ""
            ).trim() === code;

          }
        );


      if (duplicate) {

        duplicateBox.style.display =
          "block";

        duplicateBox.innerText =
          "⚠️ Barcode นี้มีอยู่ใน Google Sheet แล้ว\n\n" +
          code;


        status.className =
          "error";

        status.innerText =
          "❌ ไม่บันทึก เพราะ Barcode ซ้ำ";


        saveButton.disabled =
          false;

        saveButton.innerText =
          "💾 บันทึกลง Google Sheet";

        return;

      }

    }


    /*
      เตรียมส่งข้อมูล
    */

    saveButton.innerText =
      "⏳ กำลังบันทึก...";


    status.className =
      "info";

    status.innerText =
      "🔄 กำลังส่งข้อมูลไป Google Sheet...";


    /*
      ใช้ POST
      ชื่อ fullName ต้องตรงกับ Code.gs
    */

    const formData =
      new URLSearchParams();


    formData.append(
      "barcode",
      code
    );


    formData.append(
      "fullName",
      employeeName
    );


    formData.append(
      "nickname",
      employeeNickname
    );


    formData.append(
      "timestamp",
      new Date().toISOString()
    );


    /*
      ส่งไป Apps Script
    */

    const response =
      await fetch(
        WEB_APP_URL,
        {

          method:
            "POST",

          headers:
          {
            "Content-Type":
              "application/x-www-form-urlencoded;charset=UTF-8"
          },

          body:
            formData.toString(),

          redirect:
            "follow"

        }
      );


    /*
      อ่านผลลัพธ์
    */

    let result = null;


    try {

      result =
        await response.json();

    } catch (e) {

      /*
        กรณี Browser อ่าน response
        ไม่ได้
      */

      result = null;

    }


    /*
      ถ้า Server แจ้งซ้ำ
    */

    if (
      result &&
      result.duplicate
    ) {

      duplicateBox.style.display =
        "block";

      duplicateBox.innerText =
        "⚠️ Barcode นี้มีอยู่ใน Google Sheet แล้ว\n\n" +
        code;


      status.className =
        "error";

      status.innerText =
        "❌ ไม่บันทึก เพราะ Barcode ซ้ำ";


      saveButton.disabled =
        false;

      saveButton.innerText =
        "💾 บันทึกลง Google Sheet";

      return;

    }


    /*
      ถ้า Server แจ้ง Error
    */

    if (
      result &&
      result.success === false
    ) {

      throw new Error(
        result.message ||
        "ไม่สามารถบันทึกข้อมูลได้"
      );

    }


    /*
      ถ้าส่งสำเร็จ
    */

    addLocalBarcode(
      code
    );


    savedBox.style.display =
      "block";

    savedBox.innerText =
      "✅ บันทึกเรียบร้อย\n\n" +
      code;


    status.className =
      "success";

    status.innerText =
      "✅ บันทึกข้อมูลลง Google Sheet เรียบร้อย";


    barcode.value =
      "";

    resultBox.style.display =
      "none";


  } catch (error) {

    console.error(
      "Save error:",
      error
    );


    /*
      เนื่องจาก Browser บางกรณี
      ไม่สามารถอ่าน response จาก Apps Script
      ได้โดยตรง
    */

    status.className =
      "error";

    status.innerText =
      "❌ บันทึกไม่สำเร็จ กรุณาตรวจสอบการ Deploy Apps Script";


  }


  saveButton.disabled =
    false;

  saveButton.innerText =
    "💾 บันทึกลง Google Sheet";

});


/* =========================================================
   Enter
   ========================================================= */

barcode.addEventListener(
"keydown",
function(event) {

  if (
    event.key === "Enter"
  ) {

    event.preventDefault();

    showBarcode(
      barcode.value
    );

  }

});


/* =========================================================
   ตอนพิมพ์ Barcode
   ========================================================= */

barcode.addEventListener(
"input",
function() {

  const value =
    this.value.trim();


  savedBox.style.display =
    "none";

  duplicateBox.style.display =
    "none";


  if (value) {

    resultBox.style.display =
      "block";

    resultBox.innerText =
      "Barcode: " + value;

  } else {

    resultBox.style.display =
      "none";

  }

});


/* =========================================================
   เริ่มต้นหน้าเว็บ
   ========================================================= */

reader.classList.remove(
  "active"
);

openCamera.style.display =
  "block";

stopCamera.style.display =
  "none";

status.innerText =
  "";

</script>
